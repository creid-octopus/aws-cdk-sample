name: ECS CDK Build

on:
  push:
    paths:
      - 'cdk/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        run: echo "PACKAGE_VERSION=$(date +'%Y%m%d').${{ github.run_number }}" >> $GITHUB_ENV

      - name: Compress CDK directory
        run: zip -r ecs-cdk.${{ env.PACKAGE_VERSION }}.zip cdk

      - name: Login to Octopus Deploy 
        uses: OctopusDeploy/login@v1
        with: 
          server: https://creid.octopus.app
          service_account_id: d7b6439c-edd8-4f5c-b035-ad3a647807b4
      
      - name: Push package to Octopus
        uses: OctopusDeploy/push-package-action@v3
        with:
          packages: ecs-cdk.${{ env.PACKAGE_VERSION }}.zip
          overwrite_mode: OverwriteExisting

      - name: Create Octopus release
        uses: OctopusDeploy/create-release-action@v3
        with:
          project: ECS-Rig-CDK
          packages: ecs-cdk.${{ env.PACKAGE_VERSION }}
